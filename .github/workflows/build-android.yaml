name: Build Android APK

on:
    workflow_dispatch:
        inputs:
            source_repo:
                description: 'Repository to build'
                default: 'ManIsCat2/sm64coopdx'
            source_ref:
                description: 'Branch or tag to build'
                default: 'android-dev'

jobs:
    build-android:
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout Android source
              uses: actions/checkout@v4
              with:
                repository: ${{ inputs.source_repo }}
                ref: ${{ inputs.source_ref }}

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '17'

            - name: Install dependencies
              run: |
                sudo apt update
                sudo apt install -y build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev g++ zip unzip wget apksigner
                mkdir -p $HOME/android-sdk/cmdline-tools
                cd $HOME/android-sdk/cmdline-tools
                wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
                unzip tools.zip
                rm tools.zip
                mv cmdline-tools latest
                export ANDROID_HOME=$HOME/android-sdk
                export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
                yes | sdkmanager --licenses
                sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
                echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/platform/local.properties

            - name: Build the game
              run: |
                make -j$(nproc) TOUCH_CONTROLS=1
                chmod +x ./platform/gradlew
                ./platform/gradlew assembleRelease
                apksigner sign \
                  --key platform/android/key.pk8 \
                  --cert platform/android/certificate.pem \
                  platform/app/build/outputs/apk/release/app-release-unsigned.apk
                mv platform/app/build/outputs/apk/release/app-release-unsigned.apk build/us_pc/sm64coopdx.apk

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                name: sm64coopdx-android
                path: ./build/us_pc/sm64coopdx.apk
